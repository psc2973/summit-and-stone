# yaml-language-server: $schema=https://uniform.app/schemas/json-schema/component-definition/v1.json
$schema: https://uniform.app/schemas/json-schema/component-definition/v1.json
id: trailSystem
name: Trail System
icon: screen
parameters:
  - id: name
    name: Name
    type: text
    typeConfig: null
    localizable: true
  - id: numberOfTrailSystems
    name: Number of Trail Systems
    type: number
    helpText: how many trail systems you would like to display
    typeConfig:
      max: 12
      min: 1
useTeamPermissions: true
slots:
  - id: activities
    name: Activities
    allowedComponents:
      - trailActivity
      - $loop
    allowAllComponents: false
    inheritAllowedComponents: false
    patternsInAllowedComponents: false
titleParameter: name
canBeComposition: false

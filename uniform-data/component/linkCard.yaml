# yaml-language-server: $schema=https://uniform.app/schemas/json-schema/component-definition/v1.json
$schema: https://uniform.app/schemas/json-schema/component-definition/v1.json
id: linkCard
name: Link Card
icon: screen
parameters:
  - id: title
    name: Title
    type: text
    guidance: Short card title, about 2-6 words.
    typeConfig:
      required: true
    localizable: true
  - id: description
    name: Description
    type: text
    guidance: One or two sentences summarizing the destination.
    localizable: true
  - id: image
    name: Image
    type: asset
    guidance: Card photo. A 4:3 image works best with the standard ratio.
    typeConfig:
      required: true
      allowedTypes:
        - image
  - id: link
    name: Link
    type: link
    guidance: Destination for the card.
    typeConfig:
      required: true
      linkTypes:
        tel: false
        email: false
      linkAttributes:
        enableAnchor: true
    localizable: true
  - id: appearance
    name: Appearance
    type: group
    typeConfig:
      childrenParams:
        - imageRatio
        - hoverEffect
        - showDescription
        - showArrow
  - id: imageRatio
    name: Image Ratio
    type: select
    guidance: Crop of the card image. Standard is 4:3.
    typeConfig:
      options:
        - text: Standard (4:3)
          value: standard
        - text: Wide (16:9)
          value: wide
        - text: Square
          value: square
  - id: hoverEffect
    name: Hover Effect
    type: select
    guidance: Image motion when the pointer is over the card.
    typeConfig:
      options:
        - text: Zoom
          value: zoom
        - text: None
          value: none
  - id: showDescription
    name: Show Description
    type: checkbox
    guidance: Turn on to show the description under the title.
  - id: showArrow
    name: Show Arrow
    type: checkbox
    guidance: Turn on to show an arrow beside the title.
description: A linked card with an image, title, and optional description.
useTeamPermissions: true
slots: []
titleParameter: title
thumbnailParameter: image
canBeComposition: false
created: '2026-10-20T13:40:43.706697+00:00'
updated: '2026-10-20T13:40:43.706697+00:00'

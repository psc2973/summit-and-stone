        en-US:
          root:
            type: root
            version: 1
            children:
              - tag: h2
                type: heading
                version: 1
                children:
                  - text: Hiking to the Top of Mt. Washington
                    type: text
                    format: 0
                    version: 1
              - type: paragraph
                version: 1
                children:
                  - text: >-
                      A hike to the summit of Mt. Washington is an unforgettable
                      White Mountains adventure, combining steep trails,
                      dramatic alpine scenery, and rapidly changing weather. At
                      6,288 feet, it is the highest peak in the Northeast—and a
                      destination that rewards careful preparation.
                    type: text
                    format: 0
                    version: 1
              - type: paragraph
                version: 1
                children:
                  - text: >-
                      Many hikers begin from Pinkham Notch and follow the
                      Tuckerman Ravine Trail, a popular route that climbs
                      through forest before opening into the rugged terrain of
                      Tuckerman Ravine. From there, the trail grows steeper as
                      it ascends toward the Alpine Garden and the summit cone.
                      Expect rock scrambles, uneven footing, and long stretches
                      exposed to wind and weather above tree line.
                    type: text
                    format: 0
                    version: 1
              - type: paragraph
                version: 1
                children:
                  - text: >-
                      As you climb, pause to take in views of neighboring
                      Presidential Range peaks, deep valleys, and distant
                      ridgelines. The final approach brings you to the busy
                      summit area, where you can visit the Mt. Washington
                      Observatory, check the famous weather report, and enjoy a
                      well-earned break before beginning the descent.
                    type: text
                    format: 0
                    version: 1
              - type: quote
                version: 1
                children:
                  - type: paragraph
                    version: 1
                    children:
                      - text: >-
                          Bring warm layers, rain protection, extra food and
                          water, a map, and sturdy hiking footwear. Conditions
                          can change quickly on Mt. Washington, even in summer.
                        type: text
                        format: 0
                        version: 1
              - type: paragraph
                version: 1
                children:
                  - text: >-
                      Plan for a full day, start early, and be ready to turn
                      around if the weather deteriorates. With preparation,
                      patience, and respect for the mountain, the journey to the
                      top of Mt. Washington is a challenging and memorable hike.
                    type: text
                    format: 0
                    version: 1

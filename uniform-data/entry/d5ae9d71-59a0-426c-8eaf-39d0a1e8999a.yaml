    content:
      type: richText
      locales:
        en-US:
          root:
            type: root
            version: 1
            children:
              - type: paragraph
                version: 1
                children:
                  - text: >-
                      A sunrise hike is simple in theory: walk uphill in the
                      dark, arrive as the sky turns pink. In practice, a little
                      planning is the difference between a magical morning and a
                      cold, tired one.
                    type: text
                    format: 0
                    version: 1
              - tag: h2
                type: heading
                version: 1
                children:
                  - text: Pick a trail you already know
                    type: text
                    format: 0
                    version: 1
              - type: paragraph
                version: 1
                children:
                  - text: >-
                      Choose a route you have hiked in daylight. Knowing where
                      the trail forks, where it gets rocky and how long it takes
                      removes most of the stress of moving in the dark.
                    type: text
                    format: 0
                    version: 1
              - tag: h2
                type: heading
                version: 1
                children:
                  - text: Pack for the summit, not the trailhead
                    type: text
                    format: 0
                    version: 1
              - type: paragraph
                version: 1
                children:
                  - text: >-
                      It is warm while you climb and surprisingly cold when you
                      stop. Bring the following and you will be comfortable
                      while you wait for the sun:
                    type: text
                    format: 0
                    version: 1
              - tag: ul
                type: list
                start: 1
                version: 1
                children:
                  - type: listitem
                    value: 1
                    version: 1
                    children:
                      - text: An insulated layer and a windproof shell
                        type: text
                        format: 0
                        version: 1
                  - type: listitem
                    value: 2
                    version: 1
                    children:
                      - text: A hat and gloves, even in summer
                        type: text
                        format: 0
                        version: 1
                  - type: listitem
                    value: 3
                    version: 1
                    children:
                      - text: A headlamp with spare batteries
                        type: text
                        format: 0
                        version: 1
                  - type: listitem
                    value: 4
                    version: 1
                    children:
                      - text: A thermos of something hot
                        type: text
                        format: 0
                        version: 1
                listType: bullet
              - type: quote
                version: 1
                children:
                  - type: paragraph
                    version: 1
                    children:
                      - text: >-
                          The summit is optional. Getting back down safely is
                          not.
                        type: text
                        format: 2
                        version: 1
                    textFormat: 2
              - tag: h2
                type: heading
                version: 1
                children:
                  - text: Leave early, and leave a plan
                    type: text
                    format: 0
                    version: 1
              - type: paragraph
                version: 1
                children:
                  - text: >-
                      Aim to reach the top thirty minutes before sunrise. Tell
                      someone where you are going and when you expect to be
                      back, then enjoy the view.
                    type: text
                    format: 0
                    version: 1
